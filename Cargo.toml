[package]
name = "workbench"
version = "0.0.1"
description = "workbench command-line"
readme = "README.md"
homepage = "https://crates.io/crates/workbench"
license = "MIT OR Apache-2.0"
edition = "2024"
autoexamples = false
autobenches = false
# default-run = "workbench"

# categories = [] # https://crates.io/category_slugs


[package.metadata]
targets = [
    # "aarch64-apple-darwin",
    # "x86_64-unknown-linux-gnu",
    # "aarch64-unknown-linux-gnu",
]


[lib]
name = "workbench"
path = "src/lib.rs"

doctest = false
bench = false


[[bin]]
name = "workbench"
path = "src/main.rs"
doctest = false
bench = false
doc = false
test = false

[dependencies]
block2 = "0.6.2"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.5.57", features = ["derive", "env", "string", "unicode", "wrap_help"] }
emacs = { version = "0.20.0", features = ["bindgen", "debug", "utf-8-validation", "nonzero-integer-conversion"] }
# commonmark = "0.1.0"
git2 = "0.20.4"
# hyper = "1.8.1"
iocore = "3.1.0"
objc2 = "0.6.3"
objc2-foundation = "0.3.2"
objc2-user-notifications = "0.3.2"
# nom = "8.0.0"
# pest = "2.8.6"
# regex = "1.12.3"
# reqwest = { version = "0.13.2", features = ["gzip", "brotli", "blocking", "json", "multipart", "form", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
# serde_json = "1.0.149"
# serde_yaml = "0.9.34"
# tokio = { version = "1.49.0", features = ["full"] }
toml = "0.9.11"

[dev-dependencies]
k9 = "0.12.0"
# zeromq = "0.5.0"
